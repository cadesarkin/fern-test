# Tells Fern Clerk about each pull request that merges, so it can review the docs impact.
# Requires the repository secret FERN_TOKEN: a Fern token with access to the cadedevwork organization.
name: Fern Clerk

on:
  pull_request_target:
    types: [closed]
    branches: [main]

jobs:
  notify-fern:
    if: github.event.pull_request.merged == true
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Post the merged pull request to Fern
        env:
          FERN_FAI_URL: https://fai-dev2.buildwithfern.com
          FERN_ORG_ID: cadedevwork
          FERN_AUTOMATION_ID: 76c69c50-977c-44d9-b4ba-93a0c8cd8f78
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          curl -fsS --retry 3 --retry-all-errors --max-time 30 -X POST "$FERN_FAI_URL/agent/orgs/$FERN_ORG_ID/automations/$FERN_AUTOMATION_ID/events" \
            -H "Authorization: Bearer $FERN_TOKEN" \
            -H 'content-type: application/json' \
            -d "$(jq -nc --arg u "$PR_URL" '{pr_url: $u}')"
